<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>מה איתי היום?</title>
  <meta name="description" content="היום שלך במבט אחד: יומן, משימות ומיילים מגוגל">
  <meta name="theme-color" content="#3cc4dc">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&family=Karantina:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // apply saved theme before first paint
    try { const s = JSON.parse(localStorage.getItem('md:settings') || '{}'); if (s.theme && s.theme !== 'system') document.documentElement.dataset.theme = s.theme; } catch {}
  </script>
</head>
<body>
  <div class="splash" aria-hidden="true"><b>מה איתי היום?</b></div>
  <div id="app"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
