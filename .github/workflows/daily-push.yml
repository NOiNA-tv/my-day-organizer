name: Daily push (notifications)

# GitHub's own schedule is best-effort (it can skip hours), so an external timer (cron-job.org) also calls
# workflow_dispatch with kind=auto every 5 minutes. push/send.mjs decides what is due: the morning/evening nudges
# (push/schedule.json), the app's sealed reminders plan and the buttons' inbox (`push-data` branch), weather and
# the Design Digest. What was already sent is kept on the `push-state` branch.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      kind:
        description: 'auto (whatever is due) / morning / evening (send now) / trigger (arrived somewhere, see arg)'
        default: auto
      arg:
        description: 'for kind=trigger: the place name set on the habit, e.g. gym'
        default: ''

permissions:
  contents: write

concurrency:
  # an arrival (kind=trigger) must not be cancelled by the 5-minute timer queuing behind it
  group: daily-push-${{ github.event.inputs.kind == 'trigger' && 'trigger' || 'timer' }}

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Load state
        run: |
          git fetch origin push-state:push-state 2>/dev/null && git show push-state:state.json > /tmp/state.json || echo '{}' > /tmp/state.json
          git fetch origin push-data:push-data 2>/dev/null || true
          git show push-data:plan.json > /tmp/plan.json 2>/dev/null || echo '{}' > /tmp/plan.json
          git show push-data:inbox.json > /tmp/inbox.json 2>/dev/null || echo '[]' > /tmp/inbox.json
      - run: npm install --no-save web-push@3
      - run: node push/send.mjs
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          KIND: ${{ github.event.inputs.kind }}
          ARG: ${{ github.event.inputs.arg }}
          STATE_FILE: /tmp/state.json
          PLAN_FILE: /tmp/plan.json
          INBOX_FILE: /tmp/inbox.json
          TZ: Asia/Jerusalem
      - name: Save state
        # What was sent must be saved, or the next run sends it again. A push can fail (a GitHub hiccup, or the
        # arrival job saving at the same moment), so: retry up to 5 times, each time on top of the latest saved
        # state, keeping everything either side has sent.
        run: |
          [ -f /tmp/state.changed ] || exit 0
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            rm -rf /tmp/st; git worktree prune
            if git fetch -q origin push-state 2>/dev/null; then
              git worktree add -q --detach /tmp/st FETCH_HEAD
            else
              git worktree add -q --detach /tmp/st && (cd /tmp/st && git checkout -q --orphan tmp && git rm -rfq . 2>/dev/null; true)
            fi
            node -e '
              const fs = require("fs"), mine = JSON.parse(fs.readFileSync("/tmp/state.json", "utf8"));
              let theirs = {}; try { theirs = JSON.parse(fs.readFileSync("/tmp/st/state.json", "utf8")); } catch {}
              const out = { ...theirs, ...mine, sent: { ...(theirs.sent || {}), ...(mine.sent || {}) } };
              for (const k of ["morning", "evening", "weather", "digest"]) if ((theirs[k] || "") > (mine[k] || "")) out[k] = theirs[k];
              fs.writeFileSync("/tmp/st/state.json", JSON.stringify(out));'
            cd /tmp/st
            git add state.json
            git diff --cached --quiet && { echo "state already up to date"; exit 0; }
            git commit -qm "push state"
            if git push -q origin HEAD:refs/heads/push-state; then echo "state saved (try $i)"; exit 0; fi
            cd - >/dev/null; echo "push failed, retrying ($i)"; sleep $((i * 3))
          done
          echo "::error::could not save the push state"; exit 1
