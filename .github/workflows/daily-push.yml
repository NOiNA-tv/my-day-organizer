name: Daily push (morning & evening)

# Runs every 15 minutes; push/send.mjs decides whether it's time, using the hours in push/schedule.json
# (Jerusalem time). What was already sent today is remembered on the `push-state` branch.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      kind:
        description: 'Send now: morning / evening'
        default: morning

permissions:
  contents: write

concurrency: daily-push

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Load state
        run: |
          git fetch origin push-state:push-state 2>/dev/null && git show push-state:state.json > /tmp/state.json || echo '{}' > /tmp/state.json
      - run: npm install --no-save web-push@3
      - run: node push/send.mjs
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          KIND: ${{ github.event.inputs.kind }}
          STATE_FILE: /tmp/state.json
      - name: Save state
        run: |
          if [ -f /tmp/state.changed ]; then
            git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
            git worktree add /tmp/st push-state 2>/dev/null || { git worktree add --detach /tmp/st && cd /tmp/st && git checkout --orphan push-state && git rm -rfq . && cd -; }
            cp /tmp/state.json /tmp/st/state.json
            cd /tmp/st && git add state.json && git commit -qm "push state" && git push -q origin push-state
          fi
